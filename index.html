<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Unavailable</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --lagoon-deep:#04222E;
    --turquoise:#1FC8A9;
    --turquoise-soft:#57E2C4;
    --sand:#F6EFE1;
    --gold:#E7B65C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:'Jost',sans-serif;
    background:radial-gradient(circle at 50% 20%, #0E5C6E, var(--lagoon-deep) 70%);
    color:var(--sand);
    text-align:center;
    padding:24px;
  }
  .card{max-width:480px;}
  .wave{width:60px;height:60px;margin:0 auto 26px;}
  h1{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(24px,4vw,30px);margin:0 0 14px;color:#fff;
  }
  p{font-size:15px;line-height:1.6;opacity:.85;margin:0 0 28px;}
  a.btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--turquoise);color:var(--lagoon-deep);
    text-decoration:none;font-weight:600;font-size:14.5px;
    padding:13px 26px;border-radius:999px;
    transition:transform .18s, background .18s;
  }
  a.btn:hover{background:var(--turquoise-soft);transform:translateY(-2px);}
  .avatar{
    width:96px;height:96px;border-radius:50%;object-fit:cover;
    margin:0 auto 22px;display:block;
    border:3px solid var(--turquoise);
    box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="assets/nahushal.jpg" alt="Nahushal">
    <svg class="wave" viewBox="0 0 60 60" fill="none">
      <circle cx="30" cy="30" r="30" fill="#1FC8A9"/>
      <path d="M10 35c6-7 12 7 18 0s12-7 18 0" stroke="#04222E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M10 42c6-7 12 7 18 0s12-7 18 0" stroke="#04222E" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>
    </svg>
    <h1>This website is currently unavailable.</h1>
    <p>If you'd like to follow Nahushal's work in the meantime, you can find it here:</p>
    <a class="btn" href="https://ibrahimnahushal.substack.com/" target="_blank" rel="noopener">
      Visit the Substack
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </a>
  </div>
</body>
</html>
